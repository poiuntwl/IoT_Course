<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HW6 LED Control</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 32rem;
      margin: 4rem auto;
      padding: 0 1rem;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin: 2rem 0;
    }

    button {
      min-width: 7rem;
      padding: 0.75rem 1rem;
      font: inherit;
      cursor: pointer;
    }

    #status {
      min-height: 1.5rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>LED Control</h1>
    <div class="controls">
      <button type="button" data-state="on">ON</button>
      <button type="button" data-state="off">OFF</button>
    </div>
    <p id="status" role="status" aria-live="polite">Ready.</p>
  </main>

  <script>
    const buttons = document.querySelectorAll("button[data-state]");
    const status = document.querySelector("#status");

    async function setLed(state) {
      buttons.forEach((button) => {
        button.disabled = true;
      });
      status.textContent = `Sending ${state.toUpperCase()} command...`;

      try {
        const response = await fetch("/actuators/led", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ state }),
        });
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.detail || `Request failed with status ${response.status}`);
        }

        status.textContent = `LED ${result.state.toUpperCase()} command published.`;
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
      } finally {
        buttons.forEach((button) => {
          button.disabled = false;
        });
      }
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => setLed(button.dataset.state));
    });
  </script>
</body>
</html>
